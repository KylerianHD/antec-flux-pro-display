name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="af-pro-display-${version}-x86_64-linux"
          mkdir "$name"
          cp target/release/af-pro-display "$name/"
          cp packaging/udev/99-af-pro-display.rules "$name/"
          cp packaging/systemd/af-pro-display.service "$name/"
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Build Debian package
        run: |
          cargo install cargo-deb
          cargo deb
          cp target/debian/*.deb af-pro-display.deb
          sha256sum af-pro-display.deb > af-pro-display.deb.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            af-pro-display-*-x86_64-linux.tar.gz
            af-pro-display-*-x86_64-linux.tar.gz.sha256
            af-pro-display.deb
            af-pro-display.deb.sha256
